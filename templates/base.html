<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OllamaSQL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#0b1020; --card:#12172a; --muted:#aab1c5; --text:#e8ecf7; --accent:#7c9cff; --accent2:#5eead4; }
    *{ box-sizing: border-box; }
    body{ margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    a{ color: var(--accent); text-decoration: none; }
    header{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid #1a2240; position: sticky; top:0; background: rgba(11,16,32,0.9); backdrop-filter: blur(6px); z-index:10; }
    .brand{ display:flex; align-items:center; gap:12px; font-weight:700; }
    .brand-emoji{ font-size: 22px; }
    .container{ max-width:1200px; margin:0 auto; padding:24px; }
    .grid{ display:grid; grid-template-columns: 300px 1fr; gap: 16px; }
    @media (max-width: 980px){ .grid{ grid-template-columns: 1fr; } }
    .card{ background: var(--card); border:1px solid #1a2240; border-radius: 12px; padding: 16px; }
    h1,h2,h3{ margin: 8px 0 12px; }
    h1{ font-size: 20px; }
    h2{ font-size: 18px; }
    h3{ font-size: 16px; color: var(--muted); font-weight:600; }
    label{ font-size: 14px; color: var(--muted); display:block; margin-bottom:6px; }
    input[type="text"], select, textarea{ width:100%; background:#0f1428; color:var(--text); border:1px solid #23305d; border-radius:8px; padding:10px 12px; font-size:14px; }
    textarea{ min-height: 120px; }
    .btn{ background: linear-gradient(135deg, var(--accent), #5f86ff); color:white; border:none; border-radius:8px; padding:10px 14px; font-weight:600; cursor:pointer; }
    .btn.secondary{ background: #0f172a; border:1px solid #23305d; }
    .btn:disabled{ opacity: 0.6; cursor:not-allowed; }
    .row{ display:flex; gap:10px; align-items:center; }
    .row.wrap{ flex-wrap:wrap; }
    .stack{ display:flex; flex-direction:column; gap:10px; }
    .muted{ color: var(--muted); font-size: 13px; }
    table{ width:100%; border-collapse: collapse; font-size: 13px; }
    th, td{ border-bottom:1px solid #1a2240; padding:8px; text-align:left; }
    .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .tab{ padding:6px 10px; border:1px solid #23305d; border-radius: 999px; color: var(--muted); }
    .tab.active{ background:#0f1428; color: var(--text); }
    .flash{ padding:10px 12px; border-radius:8px; margin-bottom:12px; }
    .flash.success{ background:#0a2a1a; border:1px solid #115e38; }
    .flash.danger{ background:#2a0a0a; border:1px solid #5e1111; }
    .flash.warning{ background:#2a200a; border:1px solid #5e4d11; }
    .flash.info{ background:#0a1a2a; border:1px solid #114d5e; }
    code, pre{ background:#0f1428; color:#cdd5f6; border:1px solid #23305d; border-radius:8px; padding:6px 8px; display:block; white-space:pre-wrap; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-emoji">🦙</span>OllamaSQL</div>
    <div class="muted">Lightweight Flask UI</div>
  </header>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
